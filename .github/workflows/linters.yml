name: Lint Code Base

on:
  push:
    branches-ignore:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add workspace to git safe directories
        run: git config --global --add safe.directory /github/workspace

      - name: Run Linter against code base
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_GITHUB_ACTIONS: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_BASH: false
          LOG_LEVEL: DEBUG
          VALIDATE_JSCPD: false
          FILTER_REGEX_EXCLUDE: "(^|/)(node_modules|vendor|test-data)/.*"
